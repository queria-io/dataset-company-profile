name: Apply

on:
  push:
    branches: [main]
  schedule:
    # 毎月 5 日 05:00 JST に元データセットの更新を取り込む
    - cron: "0 20 4 * *"
  workflow_dispatch:

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    # Queria への書き込みは GitHub Actions の OIDC で 1 時間のトークンを取って行う
    permissions:
      contents: read
      id-token: write
    uses: queria-io/dataset-shared/.github/workflows/sync.yml@0eccc3cd8a42b3fd4b08fb3d2025ad6df5035407
    with:
      dataset_name: company_profile
    secrets:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

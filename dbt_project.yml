name: "company_profile"
version: "1.0.0"

profile: "company_profile"

model-paths: ["models"]
macro-paths: ["shared/macros"]

clean-targets:
  - "target"
  - "dbt_packages"

models:
  company_profile:
    +database: company_profile
    +materialized: table
    # プロファイル API (api.queria.io/v1/companies) は DuckLake のカタログを読まず、ここで書いた Parquet を
    # Range で直接読む。1 件の問い合わせでフッター 1 回と行グループ 1 つだけを読めるよう、行グループを
    # 小さくし (DuckDB が書ける最小の 2,048 行)、法人の表は法人番号の下 3 桁 (shard) ごとのファイルに分ける。
    # 行グループの大きさはスキーマに付ける (dbt は __dbt_tmp に書いてから改名するので、テーブルに付けても効かない)。
    # 表はまるごと作り直す (incremental にすると削除ファイルができ、Parquet だけを読む API が消した行を返す)
    profile:
      +pre-hook:
        - "CREATE SCHEMA IF NOT EXISTS company_profile.profile"
        - "CALL company_profile.set_option('parquet_row_group_size', 2048, schema => 'profile')"
        - "CALL company_profile.set_option('parquet_compression', 'zstd', schema => 'profile')"
      # 分けて書くテーブルは 1 スレッドで書き、法人番号の並びを保つ。書き出しの区切りを全行数 (約 500 万) より大きくして、
      # shard ごとに 1 ファイルにする (手元の計測でメモリの最大は約 9 GB)
      profile_company:
        +partitioned_by: shard
        +pre-hook:
          - "SET threads = 1"
          - "SET partitioned_write_flush_threshold = 6144000"
        +post-hook:
          - "RESET threads"
          - "RESET partitioned_write_flush_threshold"

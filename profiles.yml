company_profile:
  target: default
  outputs:
    default:
      type: duckdb
      path: ":memory:"
      database: company_profile
      schema: main
      threads: 1
      extensions:
        - httpfs
        - ducklake
        - aws
      secrets:
        - type: s3
          provider: credential_chain
          chain: process
          refresh: auto
          endpoint: "{{ env_var('QUERIA_S3_ENDPOINT_HOST', '') }}"
          url_style: path
          region: "{{ env_var('QUERIA_S3_REGION', 'auto') }}"
          use_ssl: "{{ env_var('QUERIA_S3_USE_SSL', 'true') }}"
      config_options:
        custom_user_agent: "{{ env_var('QUERIA_USER_AGENT', '') }}"
      attach:
        - path: "ducklake:{{ env_var('QUERIA_CATALOG_PATH', '') }}"
          alias: company_profile
          is_ducklake: true
          options:
            DATA_PATH: "{{ env_var('QUERIA_DATA_URL', '') }}"
            OVERRIDE_DATA_PATH: true
            META_TYPE: "'sqlite'"
            DATA_INLINING_ROW_LIMIT: 0
        - path: "ducklake:https://data.queria.io/datasets/queria/houjin_bangou/ducklake.duckdb"
          alias: houjin_bangou
          is_ducklake: true
          read_only: true
        - path: "ducklake:https://data.queria.io/datasets/queria/gbizinfo/ducklake.duckdb"
          alias: gbizinfo
          is_ducklake: true
          read_only: true
        - path: "ducklake:https://data.queria.io/datasets/queria/edinet/ducklake.duckdb"
          alias: edinet
          is_ducklake: true
          read_only: true
        - path: "ducklake:https://data.queria.io/datasets/queria/p_portal/ducklake.duckdb"
          alias: p_portal
          is_ducklake: true
          read_only: true
        - path: "ducklake:https://data.queria.io/datasets/queria/mhlw/ducklake.duckdb"
          alias: mhlw
          is_ducklake: true
          read_only: true
